<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2518" />
      <stop offset="100%" stop-color="#040b07" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <!-- Sticker 1 (Tom Nook Leaf - Green) -->
  <g transform="translate(140, 150) rotate(-15)" stroke="#fff" stroke-width="6">
    <circle cx="0" cy="0" r="60" fill="#4caf50" />
    <!-- Leaf Symbol -->
    <path d="M -5 -25 C 15 -20, 30 5, 25 25 C 10 35, -10 35, -25 25 C -35 10, -30 -10, -5 -25 Z" fill="#ffffff" stroke="#2e7d32" stroke-width="2" />
    <path d="M 12 12 A 10 10 0 0 1 24 22" fill="none" stroke="#4caf50" stroke-width="6" />
    <path d="M -5 -20 Q -8 5, -18 25" fill="none" stroke="#81c784" stroke-width="3.5" />
  </g>
  
  <!-- Sticker 2 (Super Star - Yellow) -->
  <g transform="translate(250, 170) rotate(20)" stroke="#fff" stroke-width="6">
    <circle cx="0" cy="0" r="55" fill="#fbc02d" />
    <!-- Star Shape -->
    <polygon points="0,-40 11,-12 40,-12 17,6 25,35 0,18 -25,35 -17,6 -40,-12 -11,-12" fill="#ffeb3b" stroke="#f57f17" stroke-width="2" />
    <!-- Star Eyes -->
    <ellipse cx="-6" cy="2" rx="2.5" ry="8" fill="#212121" />
    <ellipse cx="6" cy="2" rx="2.5" ry="8" fill="#212121" />
    <ellipse cx="-6" cy="-2" rx="1" ry="3" fill="#ffffff" />
    <ellipse cx="6" cy="-2" rx="1" ry="3" fill="#ffffff" />
  </g>
  
  <!-- Sticker 3 (Heart Container - Red) -->
  <g transform="translate(190, 260) rotate(5)" stroke="#fff" stroke-width="6">
    <circle cx="0" cy="0" r="50" fill="#b0bec5" />
    <circle cx="0" cy="0" r="44" fill="#37474f" />
    <!-- Heart shape -->
    <path d="M 0 -18 C -15 -35, -35 -20, -30 5 L 0 25 L 30 5 C 35 -20, 15 -35, 0 -18 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2" />
    <!-- Heart Shine -->
    <path d="M -18 -10 C -22 -18, -14 -22, -10 -20" fill="none" stroke="#ff8a80" stroke-width="2" />
  </g>
</svg>
