<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f232d" />
      <stop offset="100%" stop-color="#040b0f" />
    </radialGradient>
    <linearGradient id="pedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474f" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
    <linearGradient id="arrow-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80deea" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <!-- Stand/Pedestal -->
  <ellipse cx="200" cy="300" rx="90" ry="25" fill="url(#pedestal)" stroke="#00acc1" stroke-width="3" />
  <ellipse cx="200" cy="308" rx="85" ry="20" fill="#121212" />
  
  <!-- Link Silhouette & Action Pose -->
  <g transform="translate(140, 90)">
    <!-- Cloak & Body -->
    <path d="M 60 180 L 15 150 L 35 110 L 60 80 L 85 110 L 105 150 L 60 180 Z" fill="#006064" />
    <!-- Tunic / Chest -->
    <path d="M 40 100 L 80 100 L 90 160 L 30 160 Z" fill="#00bcd4" />
    <!-- Sleeves/Arms drawing Bow -->
    <path d="M 40 100 L 0 110 L -30 90 L -25 80 L 5 100 Z" fill="#0097a7" />
    <path d="M 80 100 L 130 90 L 140 105 L 90 115 Z" fill="#0097a7" />
    <!-- Bow Shape -->
    <path d="M 125 40 Q 155 90, 125 150" fill="none" stroke="#8d6e63" stroke-width="5" stroke-linecap="round" />
    <!-- Glowing Bow String -->
    <line x1="125" y1="42" x2="125" y2="148" stroke="#e0f7fa" stroke-width="1.5" opacity="0.8" />
    <!-- Ancient Arrow (Glowing Blue) -->
    <line x1="-30" y1="90" x2="150" y2="90" stroke="url(#arrow-glow)" stroke-width="4.5" filter="url(#glow)" />
    <!-- Arrow arrowhead details -->
    <polygon points="150,90 135,82 138,90 135,98" fill="#e0f7fa" filter="url(#glow)" />
    
    <!-- Head with Blonde Hair -->
    <circle cx="60" cy="65" r="20" fill="#ffd54f" />
    <path d="M 48 55 C 48 55, 60 45, 72 55 L 75 75 L 45 75 Z" fill="#ffb300" />
    <!-- Hood folded back -->
    <path d="M 42 75 C 42 75, 60 90, 78 75 Z" fill="#004d40" />
    
    <!-- Legs -->
    <rect x="42" y="180" width="14" height="40" fill="#8d6e63" />
    <rect x="64" y="180" width="14" height="40" fill="#8d6e63" />
    <rect x="36" y="215" width="22" height="12" rx="5" fill="#3e2723" />
    <rect x="62" y="215" width="22" height="12" rx="5" fill="#3e2723" />
  </g>
</svg>
