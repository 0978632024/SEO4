<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#112417" />
      <stop offset="100%" stop-color="#050a06" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <!-- T-Shirt Shape -->
  <g transform="translate(100, 70)">
    <!-- Sleeves -->
    <path d="M 10 30 L -50 70 L -30 100 L 20 60 Z" fill="#151515" />
    <path d="M 190 30 L 250 70 L 230 100 L 180 60 Z" fill="#151515" />
    <!-- Body -->
    <path d="M 20 30 L 180 30 L 175 220 L 25 220 Z" fill="#222222" />
    <path d="M 50 30 C 50 45, 150 45, 150 30 Z" fill="#151515" />
    
    <!-- Royal Crest (Triforce) -->
    <g fill="url(#gold-grad)" filter="url(#glow)" transform="translate(60, 70) scale(0.65)">
      <!-- Top Triangle -->
      <polygon points="60,10 20,80 100,80" />
      <!-- Left Triangle -->
      <polygon points="20,80 -20,150 60,150" />
      <!-- Right Triangle -->
      <polygon points="100,80 60,150 140,150" />
      <!-- Crest Wings and Bird -->
      <path d="M -20 170 C 10 160, 40 180, 60 165 C 80 180, 110 160, 140 170 C 100 180, 60 175, -20 170 Z" />
      <polygon points="60,165 40,195 80,195" />
      <path d="M -15 150 C -40 120, -50 90, -30 80 C -25 95, -10 110, -5 130 Z" />
      <path d="M 135 150 C 160 120, 170 90, 150 80 C 145 95, 130 110, 125 130 Z" />
    </g>
  </g>
</svg>
