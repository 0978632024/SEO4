<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1125" />
      <stop offset="100%" stop-color="#08050b" />
    </radialGradient>
    <linearGradient id="case-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <g transform="translate(70, 120)">
    <!-- Case Body -->
    <rect x="0" y="0" width="260" height="150" rx="25" fill="url(#case-base)" stroke="#111111" stroke-width="4" />
    
    <!-- Zipper Line -->
    <line x1="10" y1="75" x2="250" y2="75" stroke="#111" stroke-width="5" />
    <line x1="10" y1="75" x2="250" y2="75" stroke="#78909c" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Zipper Pull Tab -->
    <rect x="238" y="68" width="15" height="14" rx="3" fill="#e60012" />
    
    <!-- Protective Grooves -->
    <rect x="25" y="20" width="12" height="110" rx="6" fill="#1b2529" />
    <rect x="223" y="20" width="12" height="110" rx="6" fill="#1b2529" />
    
    <!-- Splatoon Paint Splatters (Neon Pink & Green) -->
    <!-- Pink Splat -->
    <path d="M 60 50 C 45 40, 40 70, 55 80 C 70 90, 95 65, 80 50 C 75 45, 65 55, 60 50 Z" fill="#e91e63" />
    <circle cx="42" cy="48" r="4" fill="#e91e63" />
    <circle cx="85" cy="85" r="5" fill="#e91e63" />
    
    <!-- Green Splat -->
    <path d="M 170 80 C 150 70, 140 100, 165 110 C 190 120, 205 90, 190 75 C 180 65, 175 85, 170 80 Z" fill="#00e676" />
    <circle cx="140" cy="78" r="5" fill="#00e676" />
    <circle cx="195" cy="115" r="4" fill="#00e676" />
    
    <!-- Middle Nintendo Switch Logo Pattern (Subtle) -->
    <g fill="#ffffff" opacity="0.15" transform="translate(115, 45) scale(0.6)">
      <!-- Left Joycon -->
      <path d="M 25 0 A 25 25 0 0 0 25 50 L 25 0 Z" />
      <circle cx="15" cy="15" r="5" fill="#37474f" />
      <!-- Right Joycon -->
      <path d="M 35 0 L 35 50 A 25 25 0 0 0 35 0 Z" />
      <circle cx="45" cy="35" r="5" fill="#ffffff" />
    </g>
  </g>
</svg>
