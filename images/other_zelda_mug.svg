<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1925" />
      <stop offset="100%" stop-color="#04070a" />
    </radialGradient>
    <linearGradient id="mug-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976d2" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <g transform="translate(100, 90)">
    <!-- Mug Handle -->
    <path d="M 160 50 Q 220 50, 220 100 Q 220 150, 160 150" fill="none" stroke="url(#mug-blue)" stroke-width="24" stroke-linecap="round" />
    <path d="M 160 50 Q 220 50, 220 100 Q 220 150, 160 150" fill="none" stroke="#0a3981" stroke-width="12" stroke-linecap="round" />
    
    <!-- Mug Body -->
    <rect x="20" y="20" width="150" height="170" rx="15" fill="url(#mug-blue)" stroke="#092f66" stroke-width="4" />
    <ellipse cx="95" cy="20" rx="75" ry="12" fill="#0c3c86" stroke="#092f66" stroke-width="3" />
    <!-- Inner shadow of mug opening -->
    <ellipse cx="95" cy="20" rx="65" ry="8" fill="#1d1d1d" />
    
    <!-- Embossed Hylian Shield / Crest -->
    <g transform="translate(62, 55) scale(0.65)" fill="url(#gold)" stroke="#092f66" stroke-width="1">
      <!-- Triforce on Mug -->
      <polygon points="50,10 20,60 80,60" />
      <!-- Crest Wings -->
      <path d="M -10 90 C 20 85, 30 100, 50 85 C 70 100, 80 85, 110 90 C 80 100, 50 95, -10 90 Z" />
      <!-- Shield Silhouette Outline in Red/Gold -->
      <path d="M 20 105 L 80 105 L 50 135 Z" fill="#d32f2f" />
    </g>
    
    <!-- Bottom Rim -->
    <rect x="35" y="185" width="120" height="12" rx="4" fill="#0a3981" />
  </g>
</svg>
