<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c2420" />
      <stop offset="100%" stop-color="#030b0a" />
    </radialGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#90a4ae" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <g transform="translate(200, 130)">
    <!-- Keychain Attachment -->
    <circle cx="0" cy="-80" r="22" fill="none" stroke="url(#silver)" stroke-width="6" />
    <ellipse cx="0" cy="-52" rx="4" ry="8" fill="none" stroke="url(#silver)" stroke-width="4" />
    <ellipse cx="0" cy="-38" rx="4" ry="8" fill="none" stroke="url(#silver)" stroke-width="4" />
    
    <!-- Animal Crossing Leaf (with bite mark) -->
    <g transform="translate(0, 20) scale(1.1)" stroke="#1b5e20" stroke-width="3">
      <!-- Leaf Base Shape -->
      <path d="M 0 -40 
               C 35 -30, 60 10, 50 50 
               C 30 65, -10 65, -45 45 
               C -60 20, -50 -20, 0 -40 Z" fill="url(#leaf-grad)" />
               
      <!-- Leaf Bite Cutout (Bottom Right) -->
      <path d="M 32 30 A 18 18 0 0 1 52 48" fill="none" stroke="#0c2420" stroke-width="12" stroke-linecap="round" />
      <path d="M 32 30 A 18 18 0 0 1 52 48" fill="none" stroke="#030b0a" stroke-width="8" stroke-linecap="round" />
      
      <!-- Leaf Center Line (Vein) -->
      <path d="M 0 -30 Q -5 10, -25 50" fill="none" stroke="#a5d6a7" stroke-width="4" stroke-linecap="round" />
      <!-- Side Veins -->
      <path d="M -4 -10 Q 15 -18, 30 -22" fill="none" stroke="#a5d6a7" stroke-width="3" stroke-linecap="round" />
      <path d="M -7 10 Q -32 5, -45 2" fill="none" stroke="#a5d6a7" stroke-width="3" stroke-linecap="round" />
      <path d="M -11 30 Q 10 25, 22 20" fill="none" stroke="#a5d6a7" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
