<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3c310b" />
      <stop offset="100%" stop-color="#120e03" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <g transform="translate(100, 100)">
    <!-- Cap Dome -->
    <path d="M 20 120 C 10 40, 190 40, 180 120 Z" fill="#ffde1a" />
    <!-- Cap Visor -->
    <path d="M 15 120 C 0 145, 200 145, 185 120 Z" fill="#e6c200" />
    <!-- Pikachu Ears on Cap -->
    <path d="M 35 45 L -10 -10 C -20 0, 10 30, 45 45 Z" fill="#ffde1a" />
    <path d="M -10 -10 L 0 5 L -10 -10 Z" fill="#000" /> <!-- ear tip -->
    <path d="M -10 -10 C -15 -5, -5 5, 5 5 Z" fill="#000000" />
    
    <path d="M 165 45 L 210 -10 C 220 0, 190 30, 155 45 Z" fill="#ffde1a" />
    <path d="M 210 -10 C 215 -5, 205 5, 195 5 Z" fill="#000000" />
    
    <!-- Pikachu Embroidered Face on Front -->
    <!-- Eyes -->
    <circle cx="70" cy="85" r="8" fill="#222222" />
    <circle cx="72" cy="83" r="3" fill="#ffffff" />
    <circle cx="130" cy="85" r="8" fill="#222222" />
    <circle cx="128" cy="83" r="3" fill="#ffffff" />
    <!-- Cheeks -->
    <circle cx="50" cy="105" r="10" fill="#ff1a1a" />
    <circle cx="150" cy="105" r="10" fill="#ff1a1a" />
    <!-- Mouth -->
    <path d="M 95 95 Q 100 100, 105 95 Q 110 100, 115 95" stroke="#222222" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
