<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a160a" />
      <stop offset="100%" stop-color="#0c0703" />
    </radialGradient>
    <linearGradient id="pedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#424242" />
      <stop offset="100%" stop-color="#151515" />
    </linearGradient>
    <linearGradient id="armor-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="50%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <!-- Sci-fi Stand -->
  <ellipse cx="200" cy="310" rx="95" ry="24" fill="url(#pedestal)" stroke="#ff7043" stroke-width="2" />
  <!-- Glowing circle inside stand -->
  <ellipse cx="200" cy="310" rx="80" ry="16" fill="none" stroke="#ff3d00" stroke-width="2" filter="url(#neon-glow)" />
  
  <!-- Samus Aran Power Suit Silhouette -->
  <g transform="translate(135, 75)">
    <!-- Legs -->
    <path d="M 40 180 L 30 240 L 45 240 L 50 190 Z" fill="#d84315" />
    <path d="M 90 180 L 100 240 L 85 240 L 80 190 Z" fill="#d84315" />
    <!-- Knee Pads -->
    <circle cx="34" cy="205" r="8" fill="#ffd54f" />
    <circle cx="96" cy="205" r="8" fill="#ffd54f" />
    
    <!-- Torso -->
    <path d="M 35 100 L 95 100 L 80 180 L 50 180 Z" fill="url(#armor-orange)" />
    <!-- Varia Suit Big Shoulders (Pauldrons) -->
    <circle cx="20" cy="95" r="22" fill="#d84315" />
    <circle cx="20" cy="95" r="16" fill="url(#armor-orange)" />
    
    <circle cx="110" cy="95" r="22" fill="#d84315" />
    <circle cx="110" cy="95" r="16" fill="url(#armor-orange)" />
    
    <!-- Left Arm with Arm Cannon -->
    <path d="M 12 110 L -5 150 L 5 170 C -10 175, -20 160, -10 145 Z" fill="#d84315" />
    <!-- Arm Cannon -->
    <rect x="-18" y="155" width="20" height="32" rx="6" fill="#2e7d32" stroke="#a5d6a7" stroke-width="1.5" />
    <!-- Glowing Green Cannon Tip -->
    <ellipse cx="-8" cy="187" rx="6" ry="3" fill="#69f0ae" filter="url(#neon-glow)" />
    
    <!-- Right Arm -->
    <path d="M 115 110 L 125 150 L 115 170" stroke="#d84315" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="112" cy="172" r="6" fill="#ffd54f" />
    
    <!-- Chest Plate / Core -->
    <path d="M 45 110 L 85 110 L 75 140 L 55 140 Z" fill="#ff3d00" />
    <line x1="65" y1="110" x2="65" y2="135" stroke="#ffd54f" stroke-width="3" />
    
    <!-- Helmet -->
    <path d="M 48 78 C 48 55, 82 55, 82 78 Z" fill="#d84315" />
    <rect x="48" y="74" width="34" height="10" fill="#ffd54f" />
    <!-- Visor (Green Glow) -->
    <polygon points="54,74 76,74 72,80 58,80" fill="#69f0ae" filter="url(#neon-glow)" />
  </g>
</svg>
