<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111823" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#b0bec5" />
      <stop offset="100%" stop-color="#37474f" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  
  <!-- Keychain Chain -->
  <g transform="translate(200, 120)">
    <!-- Ring -->
    <circle cx="0" cy="-60" r="28" fill="none" stroke="url(#metal-grad)" stroke-width="8" />
    <!-- Connector Chain Links -->
    <ellipse cx="0" cy="-25" rx="6" ry="12" fill="none" stroke="url(#metal-grad)" stroke-width="5" />
    <ellipse cx="0" cy="-5" rx="6" ry="12" fill="none" stroke="url(#metal-grad)" stroke-width="5" />
    
    <!-- Pok矇 Ball -->
    <g transform="translate(0, 50)">
      <!-- Outer outline/shadow -->
      <circle cx="0" cy="0" r="74" fill="#1e1e24" />
      <!-- Top Half (Red) -->
      <path d="M -70 0 A 70 70 0 0 1 70 0 Z" fill="#e53935" />
      <!-- Bottom Half (White) -->
      <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="#eceff1" />
      <!-- Middle Divider -->
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#1e1e24" stroke-width="10" />
      <!-- Central Button Outer -->
      <circle cx="0" cy="0" r="24" fill="#1e1e24" />
      <!-- Central Button Inner -->
      <circle cx="0" cy="0" r="14" fill="#ffffff" />
      <circle cx="-4" cy="-4" r="5" fill="#ffffff" opacity="0.3" /> <!-- Highlight -->
    </g>
  </g>
</svg>
